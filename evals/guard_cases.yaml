- id: review-velocity
  title: Third refund in 30 days
  category: review
  customer: c_priya
  order: priya_filters
  amount: 5.00
  reason: damaged
  setup:
    - {customer: c_priya, order: priya_filters, amount: 4.00, reason: damaged, messages: ["one pack torn"]}
    - {customer: c_priya, order: priya_filters, amount: 4.00, reason: damaged, messages: ["another torn"]}
  messages: ["And a few more were torn, can I get another refund?"]
