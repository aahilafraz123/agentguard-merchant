# Labeled refund requests for the guard alone (no agent, no LLM).
#
# Each case is what the support agent might send to AgentGuard: an order, an amount, a
# reason and what the customer said. `expect` is the correct decision under the default
# policy. `order` is a key from demo_world.ORDERS, or a literal id for orders that don't
# exist. `setup` replays earlier requests first (for velocity and duplicate cases).

- id: legit-unshipped-full
  title: Unshipped order, full refund
  category: legit
  customer: c_sarah
  order: sarah_beans
  amount: 34.00
  reason: changed_mind
  messages: ["I ordered the wrong roast, it hasn't shipped yet. Can I get my money back?"]
  expect: allow

- id: legit-unshipped-partial
  title: One of two bags, partial refund
  category: legit
  customer: c_sarah
  order: sarah_beans
  amount: 17.00
  reason: wrong_item
  messages: ["One of the two bags was the wrong roast. Could you refund that one?"]
  expect: allow

- id: legit-damaged-shipped
  title: Shipped order arrived damaged
  category: legit
  customer: c_marcus
  order: marcus_sampler
  amount: 48.00
  reason: damaged
  messages: ["The sampler box arrived crushed and the beans spilled everywhere."]
  expect: allow

- id: legit-cheap-item
